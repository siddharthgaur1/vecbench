[project]
name = "vecbench"
version = "0.1.0"
description = "Reproducible recall/latency/throughput/memory benchmarks for vector databases used in RAG."
requires-python = ">=3.10"
# pyarrow is not optional: cli.run() reads/writes the results/experiments.parquet
# checkpoint through pandas on its first line, so without it the documented
# quickstart dies on a clean install with "Unable to find a usable engine".
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.20",
    "chromadb>=0.5",
    "faiss-cpu>=1.8",
    "pyarrow>=15",
]

[project.scripts]
vecbench = "vecbench.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vecbench*"]
