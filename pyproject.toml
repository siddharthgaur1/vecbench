[project]
name = "vecbench"
version = "0.1.0"
description = "Reproducible recall/latency/throughput/memory benchmarks for vector databases used in RAG."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "plotly>=5.20", "chromadb>=0.5", "faiss-cpu>=1.8"]

[project.scripts]
vecbench = "vecbench.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vecbench*"]
